name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ['pet-atlas-game/dist/pet-atlas-standalone/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: touch pet-atlas-game/dist/pet-atlas-standalone/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pet-atlas-game/dist/pet-atlas-standalone
      - id: deployment
        uses: actions/deploy-pages@v4